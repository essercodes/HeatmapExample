# Routes /<service>/... to the matching backend container on the
# "heatmap" docker network, stripping the service prefix.

server {
    listen 8081;

    # Any origin may call the gateway from the browser (API Gateway has its own
    # cors_configuration). `always` covers error responses too.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Docker's embedded DNS. Resolving at request time (via variables) lets the
    # gateway start even when some services aren't running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /booking/ {
        set $upstream heatmap-booking:8000;
        rewrite ^/booking/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /vehicle/ {
        set $upstream heatmap-vehicle:8000;
        rewrite ^/vehicle/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location / {
        default_type application/json;
        return 404 '{"error": "no route"}';
    }

    # Upstream container not running / not resolvable.
    error_page 502 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error": "service unavailable"}';
    }
}
