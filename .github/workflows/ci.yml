name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_NAMESPACE: heatmap

jobs:
  # Works out which containers need testing/rebuilding. A container is included when its own
  # files change; a schema migration change, or a change to the shared build files, includes all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - 'backend/schema_migrations/**'
              - 'compose.yaml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            booking:
              - 'backend/booking/**'
            vehicle:
              - 'backend/vehicle/**'
            schema-migrations:
              - 'backend/schema_migrations/**'

      - id: matrix
        env:
          ALL: ${{ steps.filter.outputs.all }}
          BOOKING: ${{ steps.filter.outputs.booking }}
          VEHICLE: ${{ steps.filter.outputs.vehicle }}
          MIGRATIONS: ${{ steps.filter.outputs.schema-migrations }}
        run: |
          # name -> build context, in matrix order
          matrix='[]'
          add() { # name context changed
            if [ "$ALL" = true ] || [ "$3" = true ]; then
              matrix=$(jq -c --arg n "$1" --arg c "$2" '. + [{name: $n, context: $c}]' <<<"$matrix")
            fi
          }
          add booking backend/booking "$BOOKING"
          add vehicle backend/vehicle "$VEHICLE"
          add schema-migrations backend/schema_migrations "$MIGRATIONS"
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # One parallel job per changed container; each runs its own `make test-<name>`.
  test:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: make test-${{ matrix.name }}
        run: make test-${{ matrix.name }}

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: make down

  # Pushes only the containers that were tested, and only if all of those tests passed.
  push:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
