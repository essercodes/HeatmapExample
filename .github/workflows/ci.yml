name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_NAMESPACE: heatmap
  # terraform: local.name = "<project>-<environment>"; the cluster has this name and the task
  # definition families are "<ECS_CLUSTER>-<container>".
  ECS_CLUSTER: heatmap-test
  # Scheduled task families (terraform/ecs.tf), space-separated. One named "<service>-..." uses
  # that service's image, so each deploy of the service registers it with the new image.
  SCHEDULED_TASKS: booking-sync
  # One-shot migration task families (terraform/ecs.tf), space-separated, matched the same way.
  # Each deploy of the service runs its migrations with the new image before rolling it out.
  MIGRATION_TASKS: booking-migrate

jobs:
  # Works out which containers need testing/rebuilding. A container is included when its own
  # files change; a change to the shared build files includes all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - 'compose.yaml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            booking:
              - 'backend/booking/**'
            vehicle:
              - 'backend/vehicle/**'

      - id: matrix
        env:
          ALL: ${{ steps.filter.outputs.all }}
          BOOKING: ${{ steps.filter.outputs.booking }}
          VEHICLE: ${{ steps.filter.outputs.vehicle }}
        run: |
          # name -> build context, in matrix order
          matrix='[]'
          add() { # name context changed
            if [ "$ALL" = true ] || [ "$3" = true ]; then
              matrix=$(jq -c --arg n "$1" --arg c "$2" '. + [{name: $n, context: $c}]' <<<"$matrix")
            fi
          }
          add booking backend/booking "$BOOKING"
          add vehicle backend/vehicle "$VEHICLE"
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # One parallel job per changed container; each runs its own `make test-<name>`.
  test:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: make test-${{ matrix.name }}
        run: make test-${{ matrix.name }}

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: make down

  # Pushes only the containers that were tested, and only if all of those tests passed.
  push:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Migrates and rolls each rebuilt service onto its new image; ECS's circuit breaker rolls back a
  # bad deploy.
  deploy:
    needs: [changes, push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ matrix.name }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          image="$account.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_NAMESPACE/${{ matrix.name }}:$GITHUB_SHA"

          # Registers a copy of the family's latest revision running $image; prints its ARN.
          register() {
            taskdef=$(aws ecs describe-task-definition --task-definition "$ECS_CLUSTER-$1" --query taskDefinition --output json \
              | jq --arg image "$image" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
                  | .containerDefinitions[0].image = $image')
            aws ecs register-task-definition --cli-input-json "$taskdef" --query taskDefinition.taskDefinitionArn --output text
          }

          revision=$(register "${{ matrix.name }}")

          # Run the service's migrations with the new image before any task runs code that may
          # depend on them, in the service's own subnets and security group.
          # (e.g. 'booking' was rebuilt, so 'booking-migrate' runs first)
          network=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${{ matrix.name }}" \
            --query 'services[0].networkConfiguration' --output json)
          for task in $MIGRATION_TASKS; do
            case "$task" in
              "${{ matrix.name }}"-*)
                task_revision=$(register "$task")
                task_arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
                  --task-definition "$task_revision" --network-configuration "$network" \
                  --query 'tasks[0].taskArn' --output text)
                echo "Started $task_arn"
                aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"

                exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" \
                  --query 'tasks[0].containers[0].exitCode' --output text)
                if [ "$exit_code" != "0" ]; then
                  echo "::error::$task exited with code $exit_code (log group /ecs/$ECS_CLUSTER/$task)"
                  exit 1
                fi
                ;;
            esac
          done

          # update-service prints whole service as JSON to stdout, don't want to log.
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "${{ matrix.name }}" --task-definition "$revision" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${{ matrix.name }}"

          # services-stable also succeeds after a circuit-breaker rollback, so check what is running.
          running=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${{ matrix.name }}" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$running" != "$revision" ]; then
            echo "::error::${{ matrix.name }} rolled back: primary deployment is $running, expected $revision"
            exit 1
          fi

          # Scheduled tasks run their family's latest revision, so move them onto the new image only
          # once the service deployed it successfully.
          # (e.g. 'booking' was rebuilt and deployed, so 'booking-sync' gets a new revision)
          for task in $SCHEDULED_TASKS; do
            case "$task" in
              "${{ matrix.name }}"-*)
                task_revision=$(register "$task")
                echo "Registered $task_revision"
                ;;
            esac
          done
