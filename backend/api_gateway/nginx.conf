# Routes /<service>/... to the matching backend container on the
# "understory" docker network, stripping the service prefix.

server {
    listen 8081;

    # Docker's embedded DNS. Resolving at request time (via variables) lets the
    # gateway start even when some services aren't running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /booking/ {
        set $upstream understory-booking:8000;
        rewrite ^/booking/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /vehicle/ {
        set $upstream understory-vehicle:8000;
        rewrite ^/vehicle/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location / {
        default_type application/json;
        return 404 '{"error": "no route"}';
    }

    # Upstream container not running / not resolvable.
    error_page 502 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"error": "service unavailable"}';
    }
}
