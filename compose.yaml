name: heatmap

services:
  frontend:
    build: ./containers/frontend
    ports:
      - "8080:3000"
    environment:
      POLL_TIME_MIN: ${POLL_TIME_MIN:-5}
      # Used by the browser, so it must be the gateway's published port, not the service name.
      API_URL: http://127.0.0.1:8081
    depends_on:
      - gateway
    profiles: ["frontend"]

  gateway:
    build: ./containers/api_gateway
    ports:
      - "8081:8081"
    depends_on:
      - booking
      - vehicle
    profiles: ["backend"]

  # One-shot job: applies the booking service's pending migrations, then exits.
  booking-migrate:
    build: ./containers/booking
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
    profiles: ["backend"]

  booking:
    build: ./containers/booking
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    networks:
      default:
        # nginx.conf routes to the container names used by the Makefile.
        aliases: [heatmap-booking]
    profiles: ["backend"]

  booking-sync:
    build: ./containers/booking
    command: ["sh", "-c", "while :; do python sync.py; sleep ${SYNC_INTERVAL_SECONDS:-300}; done"]
    init: true
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    profiles: ["backend"]

  vehicle:
    build: ./containers/vehicle
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [heatmap-vehicle]
    profiles: ["backend"]

  db:
    build: ./containers/database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heatmap}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmap -d heatmap"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["backend"]

volumes:
  db-data:
