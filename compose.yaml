name: heatmap

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    depends_on:
      - gateway

  gateway:
    build: ./backend/api_gateway
    ports:
      - "8081:8081"
    depends_on:
      - booking
      - vehicle

  # One-shot job: applies the booking service's pending migrations, then exits.
  booking-migrate:
    build: ./backend/booking
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy

  booking:
    build: ./backend/booking
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
    networks:
      default:
        # nginx.conf routes to the container names used by the Makefile.
        aliases: [heatmap-booking]

  booking-sync:
    build: ./backend/booking
    command: ["sh", "-c", "while :; do python sync.py; sleep ${SYNC_INTERVAL_SECONDS:-300}; done"]
    init: true
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully

  vehicle:
    build: ./backend/vehicle
    environment:
      DATABASE_URL: postgresql://heatmap:${DB_PASSWORD:-heatmap}@db:5432/heatmap
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [heatmap-vehicle]

  db:
    build: ./backend/database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heatmap}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatmap -d heatmap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
